<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ajen Group - Real Estate</title>

    <link rel="stylesheet" href="styles.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>

    <!-- ===================== NAV COMPONENT ===================== -->
    <div id="site-nav"></div>


    <!-- ===================== REAL ESTATE COMPONENT ===================== -->
    <div id="site-real-estate"></div>
    <!-- ===================== CONTACT COMPONENT ===================== -->

    <div id="site-contact"></div>



    <!-- ===================== FOOTER COMPONENT ===================== -->

    <div id="site-footer"></div>



    <!-- ===================== PROPERTY MODAL ===================== -->

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" id="modalCard"></div>
    </div>



    <!-- ===================== COMPONENT LOADER ===================== -->

    <script>
      async function loadComponent(targetId, filePath) {
        const target = document.getElementById(targetId);

        if (!target) return;

        try {
          const response = await fetch(filePath);

          if (!response.ok) {
            throw new Error(`Could not load ${filePath}`);
          }

          target.innerHTML = await response.text();

        } catch (error) {
          console.error(error);
        }
      }


      async function loadRealEstatePage() {

        await Promise.all([
          loadComponent(
            "site-nav",
            "components/nav.html"
          ),

          loadComponent(
            "site-real-estate",
            "components/real-estate.html"
          ),

          loadComponent(
            "site-contact",
            "components/contact.html"
          ),

          loadComponent(
            "site-footer",
            "components/footer.html"
          ),
        ]);


        const sharedScript = document.createElement("script");

        sharedScript.src = "script.js";

        sharedScript.addEventListener("load", () => {
          const realEstateDetailScript = document.createElement("script");

          realEstateDetailScript.src = "real-estate-detail.js";

          realEstateDetailScript.addEventListener("load", () => {
            const realEstateScript = document.createElement("script");

            realEstateScript.src = "real-estate.js";

            document.body.appendChild(realEstateScript);
          });

          document.body.appendChild(realEstateDetailScript);
        });

        document.body.appendChild(sharedScript);

      }


      loadRealEstatePage();
    </script>

  </body>
</html>
