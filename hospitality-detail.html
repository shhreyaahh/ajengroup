<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajen Group - Hospitality</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <div id="site-hospitality-detail"></div>
    <div id="site-contact"></div>
    <div id="site-footer"></div>
    <script>
      async function loadComponent(targetId, filePath) {
        const target = document.getElementById(targetId);
        if (!target) return;
        try {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error(`Could not load ${filePath}`);
          target.innerHTML = await response.text();
        } catch (error) {
          console.error(error);
        }
      }
      async function loadHospitalityDetailPage() {
        await Promise.all([
          loadComponent("site-nav", "components/nav.html"),
          loadComponent("site-hospitality-detail", "components/hospitality-detail.html"),
          loadComponent("site-contact", "components/contact.html"),
          loadComponent("site-footer", "components/footer.html"),
        ]);
        const sharedScript = document.createElement("script");
        sharedScript.src = "script.js";
        sharedScript.addEventListener("load", () => {
          const detailScript = document.createElement("script");
          detailScript.src = "hospitality-detail.js";
          document.body.appendChild(detailScript);
        });
        document.body.appendChild(sharedScript);
      }
      loadHospitalityDetailPage();
    </script>
  </body>
</html>
