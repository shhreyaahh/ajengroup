<main id="realEstateDetail">
  <section class="light section-pad real-estate-detail-section">
    <div class="wrap">
      <a href="real-estate.html" class="know-more">
        <span aria-hidden="true">←</span>Back to Real Estate
      </a>

      <div class="real-estate-detail-hero">
        <img id="realEstateDetailHero" src="" alt="" />
      </div>

      <div class="real-estate-detail-grid">
        <div>
          <div class="eyebrow">Selected project</div>
          <h1 id="realEstateDetailName"></h1>
          <div class="loc" id="realEstateDetailLocation"></div>
        </div>
        <p class="lede" id="realEstateDetailDescription"></p>
      </div>

      <div class="real-estate-detail-facts" id="realEstateDetailFacts" hidden>
        <div class="fact-row" id="realEstateDetailStatusRow" hidden><span>Status</span><span id="realEstateDetailStatus"></span></div>
        <div class="fact-row" id="realEstateDetailPartnerRow" hidden><span>Partner / developer</span><span id="realEstateDetailPartner"></span></div>
        <div class="fact-row" id="realEstateDetailSpecificationsRow" hidden><span>Specifications</span><span id="realEstateDetailSpecifications"></span></div>
      </div>

      <div class="real-estate-detail-gallery" id="realEstateDetailGallery" hidden></div>
      <div class="real-estate-detail-videos" id="realEstateDetailVideos" hidden></div>
    </div>
  </section>
</main>
