<!-- ===================== AJEN GROUP CONTACT COMPONENT ===================== -->

<section class="dark-2 section-pad" id="contact">
  <div class="wrap">

    <div class="contact-grid">

      <div class="contact-left reveal">
        <h2>Start a conversation</h2>

        <p>
          For partnerships, project enquiries, accommodation and business
          opportunities, connect with our team.
        </p>

        <div class="contact-detail">
          <a href="mailto:info@ajengroup.com">info@ajengroup.com</a>
          <span style="color: var(--navy-text-dim);">
            Bhubaneswar, Odisha
          </span>
        </div>
      </div>

      <div class="contact-middle reveal">
        <div class="field">
          <label for="contactName">Name</label>

          <input
            id="contactName"
            type="text"
            placeholder="Your full name"
          />
        </div>

        <div class="field">
          <label for="contactMessage">Message</label>

          <textarea
            id="contactMessage"
            placeholder="Tell us about your enquiry"
          ></textarea>
        </div>

        <button type="button" class="btn-solid contact-submit">
          Send message
        </button>
      </div>

      <div class="contact-right reveal">
        <div class="field">
          <label for="contactEmail">Email</label>

          <input
            id="contactEmail"
            type="email"
            placeholder="you@email.com"
          />
        </div>
      </div>

    </div>

  </div>
</section>
